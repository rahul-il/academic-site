<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <style>
        .warning {
            font-weight: bold;
            text-decoration: underline;
            color: red;
        }
    </style>
</head>
<body>
    <p>So far, every map needed just four colors. Can you construct a map which requires five?</p>
    <script src='turf.min.js'></script>

    <interactive-canvas mode="draw" coloring-mode="four"></interactive-canvas>
    <div class="small" style="margin: 2px;">Warning: <span class="warning">very difficult!</span> Skip after trying a lot.</div>
    <a  href="open.html" class="button-link">Skip</a>
    <p id="graph-coloring-status"></p>
      


    <script type="module" src="interactiveCanvasElement.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hintClicked = false;
            const canvasContainerElement = document.querySelector('interactive-canvas').firstElementChild;
            const statusElement = document.getElementById('graph-coloring-status');

            function highlightElement(element){
                const oldHighlights = document.querySelectorAll('.highlight');
                for (const old of oldHighlights) {
                    old.classList.remove('highlight')
                }

                element.classList.add('highlight');
                element.scrollIntoView({ behavior: 'smooth', block: 'end' });
                

                setTimeout(() => {
                        element.classList.remove('highlight');
                        }, 1000); // Remove highlight after 2 seconds

            }




            canvasContainerElement.addEventListener('graphColoringChanged', (event) => {
                const { isColored, numberOfColors } = event.detail;

                if (!isColored) {
                    statusElement.textContent = `The map is taking too long to process on your device. Click clear, or click on skip to proceed.`;
                    highlightElement(statusElement);
                }
                
            });
        });
    </script>

    <!-- 100% privacy-first analytics -->
    <script async defer src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt="" referrerpolicy="no-referrer-when-downgrade" /></noscript>
</body>
</html>
